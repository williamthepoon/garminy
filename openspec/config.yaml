schema: spec-driven

context: |
  Garmin Connect IQ device app (Monkey C) that rotates full-screen info cards on a retired watch used as a desk display.
  Open source (MIT) and published to the Connect IQ Store: no personal data, no API keys, no hosted backend.
  Do not depend on the START button. Inputs are touch, UP, DOWN and BACK only.
  Target device: fenix7 only (260x260 round MIP, 64 colours, API 5.2). Do not add other devices unless the user asks.

rules:
  proposal:
    - State what is out of scope
  specs:
    - Every requirement has at least one WHEN/THEN scenario
  tasks:
    - Include a simulator verification task for each card

